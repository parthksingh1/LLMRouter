name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  GO_VERSION: "1.23"

jobs:
  # ---------------------------------------------------------------------------
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------------------
  size:
    name: size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/size_check.sh

  # ---------------------------------------------------------------------------
  go:
    name: gateway (go)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/gateway }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/gateway/go.sum
      - name: gofumpt
        run: |
          go run mvdan.cc/gofumpt@v0.7.0 -l . | tee /tmp/fmt.out
          test ! -s /tmp/fmt.out
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: services/gateway
      - name: test (race detector)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage floor (65% on internal/)
        run: bash ../../scripts/check_go_coverage.sh 65
      - name: build
        run: go build -trimpath -o /tmp/gateway ./cmd/gateway
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: services/gateway/coverage.out

  # ---------------------------------------------------------------------------
  python:
    name: guardrails + benchmarks (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check services benchmarks seed
          ruff format --check services benchmarks seed
      - name: mypy --strict
        run: mypy --strict services/guardrails/app
      - name: pytest (guardrails, 80% floor)
        run: pytest -q --cov=services/guardrails/app --cov-fail-under=80 services/guardrails/tests
      - name: pytest (seed + benchmarks)
        run: pytest -q benchmarks/tests seed/tests

  # ---------------------------------------------------------------------------
  determinism:
    name: seed determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: regenerate seeds and diff
        run: bash scripts/verify_determinism.sh

  # ---------------------------------------------------------------------------
  bench:
    name: benchmarks (offline) + regression gates
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: run benchmarks
        run: make bench MODE=offline
      - name: assert no committed result drifted
        # A change that moves a number must also commit the new JSON.
        run: git diff --exit-code -- benchmarks/results
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results

  # ---------------------------------------------------------------------------
  integration:
    name: wire compatibility (live stack)
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements-dev.txt
      - name: bring up the stack
        run: docker compose up -d --build
      - name: wait for readiness
        run: |
          bash scripts/wait_for.sh gateway    http://localhost:8080/readyz 180
          bash scripts/wait_for.sh guardrails http://localhost:8000/healthz 120
      - name: OpenAI Python SDK against the gateway
        run: pytest -q tests/integration
      - name: OpenAI Node SDK against the gateway
        run: |
          npm --prefix examples install --no-audit --no-fund
          node examples/node_openai_sdk.mjs
      - name: gateway-mode benchmarks agree with offline mode
        run: |
          make bench MODE=gateway
          python benchmarks/compare_modes.py
      - name: dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: tear down
        if: always()
        run: docker compose down -v

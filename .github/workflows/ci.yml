name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  GO_VERSION: "1.23"

jobs:
  # ---------------------------------------------------------------------------
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The official action is used directly as a binary rather than via
      # gitleaks/gitleaks-action, which needs a GITLEAKS_LICENSE for organisation accounts and
      # fails in seconds without one. Running the release binary is one less thing that can
      # break for a reason unrelated to whether the repository contains a secret.
      - name: install gitleaks
        run: |
          VERSION=8.21.2
          # Into a directory this job owns. /usr/local/bin needs root, and the failure mode is
          # a job that dies in four seconds for a reason that has nothing to do with secrets.
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"             | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version
      - name: scan the working tree
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact -v
      - name: scan the full history
        # --no-git above scans what is checked out; this scans every commit, which is what
        # catches a key that was committed and then "removed" in a later commit.
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v

  # ---------------------------------------------------------------------------
  size:
    name: size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/size_check.sh

  # ---------------------------------------------------------------------------
  go:
    name: gateway (go)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/gateway }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/gateway/go.sum
      - name: gofumpt
        run: |
          go run mvdan.cc/gofumpt@v0.7.0 -l . | tee /tmp/fmt.out
          test ! -s /tmp/fmt.out
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: services/gateway
      - name: test (race detector)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage floor (65% on internal/)
        run: bash ../../scripts/check_go_coverage.sh 65
      - name: build
        run: go build -trimpath -o /tmp/gateway ./cmd/gateway
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: services/gateway/coverage.out

  # ---------------------------------------------------------------------------
  python:
    name: guardrails + benchmarks (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check services benchmarks seed
          ruff format --check services benchmarks seed
      - name: mypy --strict
        run: mypy --strict services/guardrails/app
      - name: pytest (guardrails, 80% floor)
        run: pytest -q --cov=services/guardrails/app --cov-fail-under=80 services/guardrails/tests
      - name: pytest (seed + benchmarks)
        run: pytest -q benchmarks/tests seed/tests

  # ---------------------------------------------------------------------------
  determinism:
    name: seed determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: regenerate seeds and diff
        run: bash scripts/verify_determinism.sh

  # ---------------------------------------------------------------------------
  bench:
    name: benchmarks (offline) + regression gates
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: run benchmarks
        run: make bench MODE=offline
      - name: assert no committed result drifted, and the gates still hold
        # Not `git diff`: every results file carries a provenance block stamped with the time,
        # the commit and the platform, so a byte comparison fails on a clean tree every time.
        # This compares field by field, ignores provenance, allows wall-clock timings to differ
        # between machines, and asserts the absolute gates that back the README's claims.
        run: python scripts/check_results_gates.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results

  # ---------------------------------------------------------------------------
  integration:
    name: wire compatibility (live stack)
    runs-on: ubuntu-latest
    needs: [go, python]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements-dev.txt
      - name: bring up the stack
        run: docker compose up -d --build
      - name: wait for readiness
        run: |
          bash scripts/wait_for.sh gateway    http://localhost:8080/readyz 180
          bash scripts/wait_for.sh guardrails http://localhost:8000/healthz 120
      - name: OpenAI Python SDK against the gateway
        run: pytest -q tests/integration
      - name: OpenAI Node SDK against the gateway
        run: |
          npm --prefix examples install --no-audit --no-fund
          node examples/node_openai_sdk.mjs
      # The gateway-mode benchmark run used to live here and has been removed. It was not
      # measuring what it claimed. Driven over HTTP it fell back to 400 requests instead of
      # 50,000, which put the cache below its warm-up and reported an 11.8% hit rate and a 4%
      # false-hit rate "of 0 near-miss opportunities" -- a division that should never have been
      # printed. Comparing that against the offline numbers was comparing a cold cache with a
      # warm one and calling the difference a mode disagreement.
      #
      # The offline run in the `bench` job is the source of every committed number and is gated
      # properly. What is worth having here is the wire compatibility above: the real OpenAI
      # Python and Node SDKs driving the real stack. That is a check nothing else performs.
      #
      # A gateway-mode cross-check is still worth building, at a volume that warms the cache and
      # with the attribution step reading ClickHouse through a user that can actually query it
      # (it returned 403 here). Until then, an assertion that does not hold is worse than none.
      - name: dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: tear down
        if: always()
        run: docker compose down -v

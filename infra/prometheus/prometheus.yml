global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    stack: llmrouter

scrape_configs:
  # The gateway exposes its registry on a port separate from the API, so :9090 can stay on the
  # cluster network while :8080 is public.
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9090"]
        labels:
          service: llmrouter-gateway

  # Metrics that arrived over OTLP and were re-exposed by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  # The collector's own health.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

rule_files:
  - /etc/prometheus/rules/*.yml

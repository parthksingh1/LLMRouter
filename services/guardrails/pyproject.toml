[project]
name = "llmrouter-guardrails"
version = "1.0.0"
description = "Prompt screening for LLMRouter: PII, prompt injection, secrets, toxicity"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.6", "uvicorn[standard]==0.34.0", "pydantic==2.10.4"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "httpx==0.28.1", "mypy==1.14.1", "ruff==0.8.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Detectors are duck-typed against the Detector protocol; the protocol is the contract.
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
